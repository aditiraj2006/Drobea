version: '3.8'

services:
  # 🧩 MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: drobea-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: drobea
    volumes:
      - mongodb_data:/data/db
      # Optional initialization script
      - ./backend/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - drobea-network

  # ⚙️ FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drobea-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # MongoDB Connection
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/drobea?authSource=admin
      - DATABASE_NAME=drobea

      # App Config
      - SECRET_KEY=your-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173

    depends_on:
      - mongodb

    volumes:
      - ./backend:/app
      # Exclude virtualenv so it doesn't overwrite inside container
      - /app/venv

    networks:
      - drobea-network

  # 💻 Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drobea-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_APP_NAME=Drobea
      - VITE_APP_VERSION=1.0.0

    depends_on:
      - backend

    volumes:
      - ./frontend:/app
      - /app/node_modules  # prevent host override of node_modules

    networks:
      - drobea-network

# 📦 Persistent storage for MongoDB
volumes:
  mongodb_data:

# 🌐 Shared network between containers
networks:
  drobea-network:
    driver: bridge
